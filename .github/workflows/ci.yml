name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout tool_packages
        uses: actions/checkout@v4
        with:
          repository: simonplmak-cloud/tool_packages
          path: tool_packages_repo
          ref: master
          token: ${{ secrets.TOOL_PACKAGES_PAT }}

      - name: Link tool_packages
        run: ln -s "$GITHUB_WORKSPACE/tool_packages_repo" "${GITHUB_WORKSPACE}/../tool_package"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npx vitest run
