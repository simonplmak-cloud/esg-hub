name: Deploy Preview to Vercel

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout tool_packages
        uses: actions/checkout@v4
        with:
          repository: simonplmak-cloud/tool_packages
          path: tool_packages_repo
          ref: main
          token: ${{ secrets.TOOL_PACKAGES_PAT }}

      - name: Link tool_packages
        run: ln -s "$GITHUB_WORKSPACE/tool_packages_repo" "${GITHUB_WORKSPACE}/../tool_package"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npx vitest run

      - name: Production build
        run: pnpm build
        env:
          SURREAL_ENDPOINT: ${{ secrets.SURREAL_ENDPOINT }}
          SURREAL_USERNAME: ${{ secrets.SURREAL_USERNAME }}
          SURREAL_PASSWORD: ${{ secrets.SURREAL_PASSWORD }}
          SURREAL_DATABASE: ${{ secrets.SURREAL_DATABASE }}

  deploy-preview:
    runs-on: ubuntu-latest
    needs: check
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout tool_packages
        uses: actions/checkout@v4
        with:
          repository: simonplmak-cloud/tool_packages
          path: tool_packages_repo
          ref: main
          token: ${{ secrets.TOOL_PACKAGES_PAT }}

      - name: Link tool_packages
        run: ln -s "$GITHUB_WORKSPACE/tool_packages_repo" "${GITHUB_WORKSPACE}/../tool_package"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Preview to Vercel
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Preview deployment ready!\n\nURL: ${{ steps.deploy.outputs.deploy_url }}`
            })

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Run E2E tests against preview deployment
        run: pnpm test
        env:
          BASE_URL: ${{ steps.deploy.outputs.deploy_url }}
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-preview
          path: playwright-report/
          retention-days: 7
