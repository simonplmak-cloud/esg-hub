name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit

      - name: Verify Database Schema
        run: node scripts/verify-db-schema.mjs
        env:
          SURREAL_ENDPOINT: ${{ secrets.SURREAL_ENDPOINT }}
          SURREAL_USERNAME: ${{ secrets.SURREAL_USERNAME }}
          SURREAL_PASSWORD: ${{ secrets.SURREAL_PASSWORD }}
          SURREAL_NAMESPACE: ${{ secrets.SURREAL_NAMESPACE }}
          SURREAL_DATABASE: ${{ secrets.SURREAL_DATABASE }}
        continue-on-error: true

  deploy:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Trigger Vercel production deployment via API
        # Vercel's API creates a deployment from the git SHA, building on
        # Vercel's own infrastructure with full system env vars — avoids the
        # "WARN! Build not running on Vercel" issue that breaks SSR/framework detection.
        id: trigger
        run: |
          RESPONSE=$(curl -s -X POST "https://api.vercel.com/v13/deployments?teamId=${{ secrets.VERCEL_ORG_ID }}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "esg-hub",
              "project": "${{ secrets.VERCEL_PROJECT_ID }}",
              "target": "production",
              "gitSource": {
                "type": "github",
                "repoId": "'"$(curl -s https://api.github.com/repos/${{ github.repository }} -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" | python3 -c "import sys,json; print(json.load(sys.stdin)['\''id'\''])")"'",
                "ref": "${{ github.ref_name }}",
                "sha": "${{ github.sha }}"
              }
            }')
          echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print('id:', d.get('id')); print('url:', d.get('url')); print('error:', d.get('error'))"
          DEPLOY_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          DEPLOY_URL=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('url',''))")
          echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
          echo "deploy_url=https://$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Wait for deployment to be ready
        run: |
          DEPLOY_ID="${{ steps.trigger.outputs.deploy_id }}"
          echo "Waiting for deployment $DEPLOY_ID..."
          for i in $(seq 1 30); do
            STATE=$(curl -s "https://api.vercel.com/v13/deployments/${DEPLOY_ID}?teamId=${{ secrets.VERCEL_ORG_ID }}" \
              -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('readyState','UNKNOWN'))")
            echo "  attempt $i: $STATE"
            if [ "$STATE" = "READY" ]; then
              echo "✅ Deployment is ready: ${{ steps.trigger.outputs.deploy_url }}"
              exit 0
            elif [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ]; then
              echo "❌ Deployment failed with state: $STATE"
              exit 1
            fi
            sleep 10
          done
          echo "⏱ Timed out waiting for deployment"
          exit 1

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Checkout for E2E tests
        uses: actions/checkout@v4

      - name: Setup Node.js for E2E
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies for E2E
        run: npm ci

      - name: Run E2E Tests against live deployment
        run: npx playwright test
        env:
          BASE_URL: ${{ steps.trigger.outputs.deploy_url }}
          CI: "true"
        continue-on-error: true
