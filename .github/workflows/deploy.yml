name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Verify Database Schema
        run: node scripts/verify-db-schema.mjs
        env:
          SURREAL_ENDPOINT: ${{ secrets.SURREAL_ENDPOINT }}
          SURREAL_USERNAME: ${{ secrets.SURREAL_USERNAME }}
          SURREAL_PASSWORD: ${{ secrets.SURREAL_PASSWORD }}
          SURREAL_NAMESPACE: ${{ secrets.SURREAL_NAMESPACE }}
          SURREAL_DATABASE: ${{ secrets.SURREAL_DATABASE }}
        continue-on-error: true

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run Accessibility & API Tests
        run: npx playwright test --project=chromium
        env:
          TEST_BASE_URL: http://localhost:3000
        continue-on-error: true

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          SURREAL_ENDPOINT: ${{ secrets.SURREAL_ENDPOINT }}
          SURREAL_USERNAME: ${{ secrets.SURREAL_USERNAME }}
          SURREAL_PASSWORD: ${{ secrets.SURREAL_PASSWORD }}
          SURREAL_NAMESPACE: ${{ secrets.SURREAL_NAMESPACE }}
          SURREAL_DATABASE: ${{ secrets.SURREAL_DATABASE }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Output Deployment URL
        run: |
          echo "✅ Deployment complete!"
          echo "Site URL: https://hidden-harbor.vercel.app"
