name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows conventional commits
        run: |
          echo "${{ github.event.pull_request.title }}" | grep -E '^(feat|fix|ci|chore|docs|refactor|test|perf)(\(.+\))?: .+' \
            || { echo "::error::PR title must match conventional commits: feat|fix|ci|chore|docs|refactor|test|perf (optionally scoped), e.g. 'fix: broken sitemap URL'"; exit 1; }
